name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: SITE_URL
          script: |
            set -euo pipefail
            SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}"
            cd /var/www/detdom

            echo "==> Подтягиваю код"
            git config --global --add safe.directory /var/www/detdom
            git fetch --all --prune
            git reset --hard origin/master

            echo "==> NEXT_PUBLIC_SITE_URL в .env"
            if grep -q '^NEXT_PUBLIC_SITE_URL=' .env; then
              sed -i "s#^NEXT_PUBLIC_SITE_URL=.*#NEXT_PUBLIC_SITE_URL=${SITE_URL}#" .env
            else
              echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}" >> .env
            fi

            echo "==> Зависимости"
            sudo systemctl stop detdom 2>/dev/null || true
            sleep 1
            rm -rf node_modules 2>/dev/null || find node_modules -mindepth 1 -delete 2>/dev/null || true
            npm ci

            echo "==> Миграции Payload (схема из дампа — отметить + только новые)"
            DB_URL="$(grep ^DATABASE_URL= .env | cut -d= -f2-)"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f deploy/mark-migrations.sql
            printf 'y\n' | npm run migrate

            echo "==> Сборка"
            npm run build

            echo "==> Возврат владельца файлов сервису"
            chown -R detdom:detdom /var/www/detdom

            echo "==> Проверка домена (nginx + SSL)"
            DOMAIN="$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##; s#:.*$##')"
            PREV_DOMAIN="$(cat /var/www/detdom/.deployed_domain 2>/dev/null || true)"
            if [ -n "$DOMAIN" ] && [ "$DOMAIN" != "$PREV_DOMAIN" ]; then
              echo "Домен изменился: '${PREV_DOMAIN}' -> '${DOMAIN}', перенастраиваю nginx + SSL"
              sudo /usr/bin/bash /var/www/detdom/deploy/setup-domain.sh "$DOMAIN"
            else
              echo "Домен не менялся ($DOMAIN) — пропускаю."
            fi

            echo "==> Перезапуск сервиса"
            sudo /usr/bin/systemctl restart detdom
            sleep 3
            sudo /usr/bin/systemctl --no-pager status detdom | head -n 15
