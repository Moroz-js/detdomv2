name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: SITE_URL
          script: |
            set -euo pipefail
            SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
            cd /var/www/detdom

            echo "==> Подтягиваю код"
            git fetch --all --prune
            git reset --hard origin/main

            echo "==> NEXT_PUBLIC_SITE_URL в .env"
            if grep -q '^NEXT_PUBLIC_SITE_URL=' .env; then
              sed -i "s#^NEXT_PUBLIC_SITE_URL=.*#NEXT_PUBLIC_SITE_URL=${SITE_URL}#" .env
            else
              echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}" >> .env
            fi

            echo "==> Зависимости"
            npm ci

            echo "==> Миграции Payload"
            npm run migrate

            echo "==> Сборка"
            npm run build

            echo "==> Перезапуск сервиса"
            sudo /usr/bin/systemctl restart detdom
            sleep 3
            sudo /usr/bin/systemctl --no-pager status detdom | head -n 15
